# Domain tests and a build of the app at every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: TakkuCore tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: TakkuCore
        run: swift test

  app-build:
    name: App build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ hashFiles('Takku.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      # Without Config/Local.xcconfig the app is signed ad hoc, as in Base.xcconfig.
      - name: xcodebuild
        run: >
          xcodebuild -project Takku.xcodeproj -scheme Takku -configuration Debug
          -derivedDataPath build/DerivedData -skipPackagePluginValidation -skipMacroValidation
          build
